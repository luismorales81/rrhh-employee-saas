services:
  postgres:
    image: postgres:16-alpine
    container_name: rrhh-postgres
    environment:
      POSTGRES_DB: rrhh_saas
      POSTGRES_USER: rrhh
      POSTGRES_PASSWORD: rrhh_secret
    ports:
      - "5432:5432"
    volumes:
      - rrhh_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rrhh -d rrhh_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: rrhh-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rrhh_minio
      MINIO_ROOT_PASSWORD: rrhh_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rrhh_minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: rrhh-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 rrhh_minio rrhh_minio_secret;
      mc mb local/rrhh-archivos --ignore-existing;
      mc version enable local/rrhh-archivos;
      exit 0;
      "

volumes:
  rrhh_pg_data:
  rrhh_minio_data:
