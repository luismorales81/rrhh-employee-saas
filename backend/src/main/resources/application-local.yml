spring:
  datasource:
    url: jdbc:h2:file:./data/rrhh_local;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.rrhh.saas: DEBUG

app:
  jwt:
    secreto: rrhh-saas-jwt-secreto-desarrollo-cambiar-en-produccion-minimo-256-bits
