# Perfil producción — activar con: --spring.profiles.active=prod
# Variables de entorno recomendadas: DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD,
# JWT_SECRETO, S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY, S3_BUCKET

server:
  error:
    include-message: never
    include-stacktrace: never

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/rrhh_saas}
    username: ${DATABASE_USER:rrhh}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    origenes: ${CORS_ORIGENES}
  demo:
    cargar-datos: false
  recibos:
    verificacion-integridad:
      habilitada: true
    dias-alerta-pendiente: 7
    requiere-contrasena-firma: false
    url-mis-recibos: ${URL_PORTAL_EMPLEADO}/mis-recibos
  correo:
    habilitado: ${CORREO_HABILITADO:true}
    remitente: ${CORREO_REMITENTE}
  almacenamiento:
    proveedor: ${ALMACENAMIENTO_PROVEEDOR:s3}
    tamano-maximo-mb: ${ALMACENAMIENTO_TAMANO_MAX_MB:10}
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${S3_REGION:auto}
      bucket: ${S3_BUCKET:rrhh-archivos-prod}
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      path-style: ${S3_PATH_STYLE:true}
  jwt:
    secreto: ${JWT_SECRETO}
    expiracion-ms: ${JWT_EXPIRACION_MS:3600000}
    refresco-expiracion-ms: ${JWT_REFRESCO_MS:604800000}

logging:
  level:
    com.rrhh.saas: INFO
    org.springframework: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
