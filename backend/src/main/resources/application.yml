spring:
  application:
    name: rrhh-saas-backend
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/rrhh_saas
    username: rrhh
    password: ${DATABASE_PASSWORD:rrhh_secret}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true

server:
  port: 8080

app:
  demo:
    cargar-datos: true
    url-pdf-contrato: http://localhost:4200/demo/contrato-ejemplo.pdf
    url-pdf-recibo: http://localhost:4200/demo/recibo-ejemplo.pdf
  almacenamiento:
    proveedor: disco
    ruta-base: ./data/archivos
    tamano-maximo-mb: 10
  recibos:
    verificacion-integridad:
      habilitada: true
    dias-alerta-pendiente: 7
    requiere-contrasena-firma: false
    url-mis-recibos: ${URL_PORTAL_EMPLEADO:http://localhost:4200}/mis-recibos
  certificados:
    ia:
      simulada: ${CERTIFICADOS_IA_SIMULADA:false}
    reintento:
      cron: ${CERTIFICADOS_REINTENTO_CRON:0 */5 * * * *}
      minutos-colgado: ${CERTIFICADOS_REINTENTO_MINUTOS:10}
  correo:
    habilitado: ${CORREO_HABILITADO:false}
    remitente: ${CORREO_REMITENTE:noreply@rrhh.local}
    nombre-remitente: Ligo
  jwt:
    secreto: ${JWT_SECRETO:rrhh-saas-jwt-secreto-desarrollo-cambiar-en-produccion-minimo-256-bits}
    expiracion-ms: 3600000
    refresco-expiracion-ms: 604800000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.rrhh.saas: INFO
